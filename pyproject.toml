[project]
name = "langchain-aiagents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Satya Annepogu", email = "satya.annepogu@millicom.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "dotenv>=0.9.9",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.7.4",
    "openai>=3.49.0",
    "sqlit>=0.1.6",
    "wikipedia>=1.4.0",
]

[project.scripts]
langchain-aiagents = "langchain_aiagents:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
